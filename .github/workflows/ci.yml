name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x gradlew
      - run: ./gradlew build
      - run: ./gradlew test

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-build-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shift-payroll-backend:latest .